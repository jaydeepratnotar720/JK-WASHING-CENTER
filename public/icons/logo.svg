<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#002966" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield/Hexagon Badge Background -->
  <polygon points="200,20 360,90 360,290 200,380 40,290 40,90" fill="#080c14" stroke="url(#neonCyan)" stroke-width="8" filter="url(#glow)" />
  <polygon points="200,32 346,96 346,282 200,366 54,282 54,96" fill="#0c121e" stroke="#003d99" stroke-width="2" />

  <!-- Water Splash / Speed Waves -->
  <path d="M 90 220 C 130 190, 160 250, 200 220 C 240 190, 270 250, 310 220" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  
  <!-- Monogram JK -->
  <!-- J -->
  <path d="M 120 120 L 175 120 L 175 220 C 175 255, 145 265, 115 255 L 115 230 C 130 236, 150 236, 150 215 L 150 145 L 120 145 Z" fill="url(#neonCyan)" />
  
  <!-- K -->
  <path d="M 205 120 L 230 120 L 230 180 L 275 120 L 305 120 L 255 185 L 310 260 L 280 260 L 235 198 L 230 205 L 230 260 L 205 260 Z" fill="#ffffff" />

  <!-- Speed Detailing Stars/Sparkles -->
  <polygon points="200,65 204,78 217,82 204,86 200,99 196,86 183,82 196,78" fill="#00f0ff" />
  <polygon points="315,105 318,114 327,117 318,120 315,129 312,120 303,117 312,114" fill="#00f0ff" />

  <!-- Bottom Brand Text -->
  <text x="200" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#00f0ff" text-anchor="middle" letter-spacing="4">JK WASHING</text>
  <text x="200" y="345" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#91caff" text-anchor="middle" letter-spacing="3">CAR &amp; BIKE CARE</text>
</svg>
